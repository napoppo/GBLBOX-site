name: Update battle data

# PvPoke / PokeAPI から battle master data を再生成して配信する。
# アプリは gblbox.com/data/*.json を24h毎に取得し、次回起動で反映する。
on:
  schedule:
    - cron: "0 18 * * *"   # 毎日 18:00 UTC (翌 03:00 JST)
  workflow_dispatch: {}     # 手動実行も可

permissions:
  contents: write

concurrency:
  group: update-battle-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Fetch & build pokedex.json and moves.json
        run: python scripts/update_battle_master.py --output-dir data

      - name: Fetch & build pvpoke_movesets.json
        run: python scripts/update_pvpoke_moves.py --output data/pvpoke_movesets.json

      - name: Fetch & build mega_specs.json
        run: python scripts/update_mega_specs.py --output data/mega_specs.json

      - name: Validate
        run: |
          python scripts/validate_battle_master.py data/pokedex.json data/moves.json data/pvpoke_movesets.json
          python scripts/validate_pvpoke_movesets.py data/pvpoke_movesets.json
          python scripts/validate_mega_specs.py data/mega_specs.json data/pokedex.json

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/pokedex.json data/moves.json data/pvpoke_movesets.json data/mega_specs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pokedex.json data/moves.json data/pvpoke_movesets.json data/mega_specs.json
            git commit -m "chore: update battle data from upstream"
            git push
          else
            echo "No battle data changes."
          fi
